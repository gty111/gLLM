name: rust-frontend

on:
  push:
    branches: [master]
    paths: ["rust/frontend/**", ".github/workflows/rust-frontend.yml"]
  pull_request:
    paths: ["rust/frontend/**", ".github/workflows/rust-frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/frontend
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # Keep in sync with `rust-version` in rust/frontend/Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/frontend
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --locked
